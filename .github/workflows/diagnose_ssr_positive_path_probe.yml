name: Diagnose SSR Positiv-Pfad Probe — restricted_t=True beweisbar? (read-only)

# Wegwerf-Probe (Muster #510): der EINE offene SSR-Punkt (Verify seit #491) ist,
# ob der Positiv-Pfad von ssr_restriction.collect_ssr_restriction_flags jemals
# restricted_t=True auf LIVE-Cboe-Daten liefert — oder ob die Symbol-Zuordnung
# still fehlschlägt (0/91 restricted_t=True in der 28.07.–07.08.-Auswertung war
# strukturell plausibel, aber der Positiv-Pfad hat auf echten Daten NIE gefeuert;
# nur Unit-Tests mit injiziertem cboe_text belegten ihn).
#
# POINTE: kein von außen bekannter SSR-Fall nötig. Die Cboe-Jahres-CSV listet
# selbst alle heute restringierten Symbole. Die Probe:
#   1. Cboe-Datei live holen — DERSELBE Pfad wie im Produktivlauf
#      (ssr_restriction._http_get_text + parse_cboe_csv).
#   2. Unabhängige Ground-Truth aus den ROHzeilen: welche Symbole sind HEUTE
#      (Rule-201-Fenster T / Vortag, nicht beendet/rescinded) restringiert?
#   3. Erstes/mittleres/letztes dieser restringierten Symbole durch die
#      ÖFFENTLICHE Modul-API → Erwartung restricted_t=True (Positiv-Pfad-Beweis).
#   4. Gegenprobe: ein aktueller Top-10-Ticker (aus app_data.json), der NICHT in
#      der Datei steht → Erwartung restricted_t=False.
#   5. Aggregat-Kreuzcheck: Modul-Sicht über ALLE Datei-Symbole == unabhängige
#      Roh-Ground-Truth? (stärkster Konventions-Beweis.)
#   6. Bei MISMATCH (Symbol restringiert-heute, Modul sagt False): Roh-Symbol
#      aus der Datei vs. Modul-Normalisierung nebeneinander → Konventions-Bug
#      direkt sichtbar.
#   7. Liveness: ein Symbol durch die API OHNE injizierten Text (Modul holt
#      selbst) → beweist die echte Produktions-Fetch-Orchestrierung.
#
# KEINE Persistenz. KEINE Secrets. KEINE Repo-Writes. contents:read.
# Trigger: workflow_dispatch only. Fetch-Fail wird AUSGEWIESEN, nie als False
# gefaked. Jeder Aufruf in try/except, kein Hartkodieren.

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "ET-Handelstag T (YYYY-MM-DD), leer = heute (ET)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    env:
      OUT_DIR: ${{ github.workspace }}/ssr-positive-probe-out
      REPORT_DATE_IN: ${{ github.event.inputs.report_date }}

    steps:
      - name: Checkout (contents:read — ssr_restriction.py + app_data.json lesen)
        uses: actions/checkout@v4

      - name: Prepare output dir
        run: mkdir -p "$OUT_DIR"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests (nur der Cboe-Fetch braucht es)
        run: |
          python -m pip install --upgrade pip
          pip install requests
          python -c "import requests, sys; print('requests', requests.__version__)"

      - name: Probe — SSR Positiv-Pfad (echter Modul-Pfad, read-only)
        run: |
          python - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone

          OUT = os.environ["OUT_DIR"]

          # ── Modul + Config aus dem Repo (Produktiv-Code, kein Nachbau) ──────────
          try:
              import ssr_restriction as ssr
          except Exception as exc:
              print(f"FATAL: import ssr_restriction fehlgeschlagen: {exc}")
              sys.exit(0)
          try:
              import config
              HOL = getattr(config, "US_MARKET_HOLIDAYS", frozenset())
          except Exception:
              HOL = frozenset()

          # ── T bestimmen (ET-Handelstag) ────────────────────────────────────────
          rd_in = (os.environ.get("REPORT_DATE_IN") or "").strip()
          if rd_in:
              T = ssr._norm_report_date(rd_in)
          else:
              try:
                  from zoneinfo import ZoneInfo
                  T = datetime.now(ZoneInfo("America/New_York")).date()
              except Exception:
                  T = datetime.now(timezone.utc).date()
          if T is None:
              print(f"FATAL: report_date unbrauchbar: {rd_in!r}")
              sys.exit(0)
          now_utc = datetime.now(timezone.utc)
          print(f"### T (ET-Handelstag) = {T.isoformat()}   Abruf = {now_utc.isoformat()}")
          print("=" * 64)

          # ── 1. Cboe-Datei LIVE holen — derselbe Pfad wie im Produktivlauf ──────
          url = ssr._CBOE_URL_TMPL.format(yr=T.year)
          ua = ssr._default_ua()
          text = None
          try:
              text = ssr._http_get_text(url, ua, 20)
          except Exception as exc:
              print(f"FETCH-FEHLER (fail-soft, ≠ False): {exc}")
          if not text:
              print("FETCH-FAIL: Cboe-Datei nicht erreichbar/leer.")
              print("→ Positiv-Pfad HEUTE NICHT prüfbar (kein Fake). Erneut laufen.")
              print("VERDIKT 1: Positiv-Pfad bewiesen: UNBESTIMMT (Fetch-Fail)")
              print("VERDIKT 2: Symbol-Konvention sauber: UNBESTIMMT (Fetch-Fail)")
              sys.exit(0)
          print(f"Cboe-CSV geholt: {len(text)} Bytes  ({url})")

          # ── Parsen (Modul-Funktion) + Roh-Symbol-Map für die Bug-Diagnose ─────
          try:
              rows, source_latest = ssr.parse_cboe_csv(text)
          except Exception as exc:
              print(f"PARSE-FEHLER (fail-soft): {exc}")
              sys.exit(0)
          all_syms = sorted({r["symbol"] for r in rows})
          print(f"Zeilen geparst: {len(rows)}   distinkte Symbole: {len(all_syms)}   "
                f"jüngster Trigger im File: {source_latest}")

          # Roh-Symbol (vor strip/upper) je normalisiertem Symbol — für MISMATCH-Diagnose.
          import csv, io
          raw_by_norm = {}
          try:
              for raw in csv.DictReader(io.StringIO(text)):
                  rs = raw.get("Symbol")
                  if rs:
                      raw_by_norm.setdefault((rs or "").strip().upper(), rs)
          except Exception:
              pass

          # ── 2. Unabhängige Ground-Truth aus den ROHzeilen (nicht via Modul) ────
          prev_td = ssr._prev_trading_day(T, HOL)
          def _active(r):
              td = r["trigger_date"]
              if td != T and td != prev_td:
                  return False
              rd = r["rescinded_date"]
              if rd is not None and rd < T:
                  return False
              ed = r["end_date"]
              if ed is not None and ed < T:
                  return False
              return True
          restricted_raw = sorted({r["symbol"] for r in rows if _active(r)})
          print(f"Rule-201-Fenster T={T.isoformat()} / Vortag={prev_td.isoformat()}")
          print(f"UNABHÄNGIGE Ground-Truth — heute restringierte Symbole: "
                f"{len(restricted_raw)}")
          if restricted_raw[:15]:
              print(f"  (Auszug: {restricted_raw[:15]})")

          # ── 5. Aggregat-Kreuzcheck: Modul-Sicht über ALLE Datei-Symbole ───────
          mod_restricted = set()
          try:
              flags_all = ssr.collect_ssr_restriction_flags(
                  all_syms, report_date=T, now_utc=now_utc, cboe_text=text)
              mod_restricted = {s for s, w in flags_all.items()
                                if isinstance(w, dict) and w.get("restricted_t")}
          except Exception as exc:
              print(f"Aggregat-Aufruf FEHLER (fail-soft): {exc}")
              flags_all = {}
          agree = mod_restricted == set(restricted_raw)
          print("=" * 64)
          print(f"KREUZCHECK — Modul-restringiert: {len(mod_restricted)} · "
                f"Roh-Ground-Truth: {len(restricted_raw)} · "
                f"{'IDENTISCH ✓' if agree else 'ABWEICHUNG ✗'}")
          only_raw = sorted(set(restricted_raw) - mod_restricted)
          only_mod = sorted(mod_restricted - set(restricted_raw))
          if only_raw:
              print(f"  nur Roh (Modul verpasst): {only_raw[:15]}")
          if only_mod:
              print(f"  nur Modul (Roh verpasst): {only_mod[:15]}")

          # ── Auswahl: erstes / mittleres / letztes restringiertes Symbol ───────
          picks = []
          if restricted_raw:
              n = len(restricted_raw)
              idxs = sorted(set([0, n // 2, n - 1]))
              picks = [restricted_raw[i] for i in idxs]

          def _one(sym, *, cboe_text):
              """Öffentliche API für EIN Symbol; robust. Returnt (collected, restricted_t)."""
              try:
                  res = ssr.collect_ssr_restriction_flags(
                      [sym], report_date=T, now_utc=now_utc, cboe_text=cboe_text)
                  w = res.get(sym) or {}
                  return w.get("collected"), w.get("restricted_t")
              except Exception as exc:
                  return None, f"ERROR:{exc}"

          # ── 3./4./6. Per-Symbol-Zeilen (Positiv + Gegenprobe) ─────────────────
          print("=" * 64)
          print("PER-SYMBOL (SYMBOL | in_datei=ja/nein | modul_liefert=True/False | MATCH/MISMATCH)")
          n_mismatch = 0

          # Positiv: erwartet in_datei=ja (restringiert-heute) + modul=True.
          for sym in picks:
              _, rt = _one(sym, cboe_text=text)
              in_datei = "ja"
              modul = "True" if rt is True else ("False" if rt is False else str(rt))
              ok = rt is True
              verd = "MATCH" if ok else "MISMATCH"
              if not ok:
                  n_mismatch += 1
              print(f"  {sym:8s} | in_datei={in_datei:4s} | modul_liefert={modul:5s} | {verd}")
              if not ok:
                  raw = raw_by_norm.get(sym, "<roh nicht gefunden>")
                  print(f"           ↳ BUG-DIAGNOSE: Roh-Symbol in Datei = {raw!r}  ·  "
                        f"Modul-Normalisierung (input) = {sym.strip().upper()!r}")

          # Gegenprobe: aktueller Top-10-Ticker, NICHT in der Datei.
          top10 = []
          try:
              with open("app_data.json", encoding="utf-8") as fh:
                  ad = json.load(fh)
              top10 = list((ad.get("setup_scores") or {}).keys())
          except Exception as exc:
              print(f"  (app_data.json nicht lesbar: {exc})")
          file_set = set(all_syms)
          neg = next((t for t in top10 if (t or "").strip().upper() not in file_set), None)
          if neg is None:
              print("  (kein Top-10-Ticker außerhalb der Datei gefunden — Gegenprobe übersprungen)")
          else:
              _, rt = _one(neg, cboe_text=text)
              modul = "True" if rt is True else ("False" if rt is False else str(rt))
              ok = rt is False
              verd = "MATCH" if ok else "MISMATCH"
              if not ok:
                  n_mismatch += 1
              print(f"  {neg:8s} | in_datei=nein | modul_liefert={modul:5s} | {verd}   (Gegenprobe, Top-10)")

          # ── 7. Liveness: echte Produktions-Fetch-Orchestrierung (ohne inject) ─
          print("=" * 64)
          if picks:
              coll, rt = _one(picks[0], cboe_text=None)   # Modul holt SELBST
              print(f"LIVENESS (Modul-Selbst-Fetch) — {picks[0]}: "
                    f"collected={coll} · restricted_t={rt}   "
                    f"({'Produktions-Fetch OK' if rt is True else 'siehe oben'})")
          else:
              print("LIVENESS: übersprungen (heute 0 restringierte Symbole).")

          # ── Artefakt-Dump ─────────────────────────────────────────────────────
          try:
              with open(os.path.join(OUT, "ssr_positive_probe.json"), "w") as fh:
                  json.dump({
                      "T": T.isoformat(), "url": url, "bytes": len(text),
                      "n_rows": len(rows), "n_symbols": len(all_syms),
                      "source_latest_trigger": source_latest,
                      "restricted_raw": restricted_raw,
                      "mod_restricted": sorted(mod_restricted),
                      "picks": picks, "negative": neg,
                  }, fh, indent=2, default=str)
          except Exception:
              pass

          # ── 2-Zeilen-Verdikt ──────────────────────────────────────────────────
          print("=" * 64)
          if not restricted_raw:
              print("VERDIKT 1: Positiv-Pfad bewiesen: UNBESTIMMT "
                    "(heute 0 restringierte Symbole — an einem Trigger-Tag erneut laufen)")
              print("VERDIKT 2: Symbol-Konvention sauber: UNBESTIMMT (keine Positiv-Fälle heute)")
          else:
              proven = (n_mismatch == 0) and any(_one(s, cboe_text=text)[1] is True for s in picks)
              clean = agree and (n_mismatch == 0)
              print(f"VERDIKT 1: Positiv-Pfad bewiesen: {'JA' if proven else 'NEIN'} "
                    f"({len(picks)} Positiv-Fälle, {n_mismatch} Mismatch)")
              print(f"VERDIKT 2: Symbol-Konvention sauber: {'JA' if clean else 'NEIN'} "
                    f"(Aggregat-Kreuzcheck {'identisch' if agree else 'abweichend'})")
          PY

      - name: Upload raw responses als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssr-positive-path-probe
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
