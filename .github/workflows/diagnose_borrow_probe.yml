name: Diagnose Borrow Source Probe (read-only)

# WEGWERF-Machbarkeitsprobe für eine Borrow-Ersatzquelle nach dem iBorrowDesk-
# Tod (23.07.2026). Misst zwei keyless-Kandidaten NUR im Runner (die lokale
# Sandbox ist egress-deny-all):
#   1) IBKR Public Shortable-Stock-File (CTB-Fee + Verfügbarkeit, Ursprungsquelle)
#   2) stockanalysis.com CTB-Re-Check (bereits integrierter Pfad)
#
# KEINE Secrets. KEINE Repo-Writes (nur Artefakt-Upload). Reines read-only.
# Trigger ausschließlich workflow_dispatch (manuell). stdlib-only, kein pip.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      OUT_DIR: ${{ github.workspace }}/probe-out

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run borrow-source probe
        run: |
          mkdir -p "$OUT_DIR"
          python scripts/probe_borrow_source.py 2>&1 | tee "$OUT_DIR/probe_log.txt"

      - name: Upload raw probe artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: borrow-probe-raw
          path: ${{ env.OUT_DIR }}/
          retention-days: 7
