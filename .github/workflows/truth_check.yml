name: Wahrheits-Abgleich

# Dauerhafter, NUR LESENDER Wächter (Easy-Entscheid 08.11.2026): rechnet
# gespeicherte Verhältnis-Felder (Renditen, max_gain/max_drawdown, Exit-
# Shadow-Forwards, vix_level, market_regime, entry_past_return_5d) aus frisch
# geladenen Yahoo-Kursen nach den Produktionsregeln nach — scripts/truth_check.py.
# Ergebnis NUR in truth_check_log.jsonl + truth_check_state.json; ausgewertet
# von Health-Check S16 (Daily-Run, ohne Netz) und als Zeile im Digest.
#
# Zeitplan: werktags 23:07 UTC — nach dem Postclose-Termin (21:37 UTC). Ein
# verspäteter Postclose stört nicht: frisch gereifte Zeilen werden dann am
# Folgetag geprüft (Zählung über die Zeilenzahl im State).
#
# Gleichzeitigkeit: eigene concurrency-Gruppe (nie zwei Abgleiche parallel).
# BEWUSST KEINE gemeinsame Gruppe mit dem Daily-Run — GitHub verwirft in einer
# Gruppe einen wartenden Lauf, wenn ein neuer dazukommt; ein wartender
# Postclose dürfte nie wegen dieses Wächters verloren gehen (vgl. Lesson 8z8).
# Kein Konflikt beim Schreiben: der Commit-Schritt fasst NUR die zwei eigenen
# Dateien an und setzt bei jedem Versuch auf den neuesten origin/main-Stand auf.
#
# Kein healthchecks.io-Ping (eigener Check wäre Easys Entscheidung).
# Rückweg: diese Datei löschen oder den Workflow in GitHub deaktivieren — die
# Log-/State-Dateien bleiben liegen; S16 meldet dann nach 2 Handelstagen
# „läuft nicht“ (warn).

on:
  schedule:
    - cron: '7 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write   # NUR für truth_check_log.jsonl + truth_check_state.json

concurrency:
  group: truth-check
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  truth-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Wahrheits-Abgleich
        run: python scripts/truth_check.py

      - name: Commit truth-check log + state
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Muster wie health_check_digest.yml: frische Versionen sichern, dann
          # in einer Retry-Schleife auf den NEUESTEN origin/main-Stand aufsetzen
          # (reset --hard) und NUR die zwei eigenen Dateien wieder einspielen.
          # Verlustfrei, weil dieser Workflow keine anderen Dateien schreibt.
          FRESH_LOG="${RUNNER_TEMP:-/tmp}/truth_check_log_fresh.jsonl"
          FRESH_STATE="${RUNNER_TEMP:-/tmp}/truth_check_state_fresh.json"
          if [ ! -f truth_check_log.jsonl ] || [ ! -f truth_check_state.json ]; then
            echo "Kein Log/State geschrieben — nichts zu committen."
            exit 0
          fi
          cp truth_check_log.jsonl "$FRESH_LOG"
          cp truth_check_state.json "$FRESH_STATE"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if ! git fetch origin main; then
              echo "fetch fehlgeschlagen (Versuch $attempt) — retry."
              sleep 2
              continue
            fi
            git reset --hard origin/main
            cp "$FRESH_LOG" truth_check_log.jsonl
            cp "$FRESH_STATE" truth_check_state.json
            git add truth_check_log.jsonl truth_check_state.json
            if git diff --staged --quiet; then
              echo "Keine Aenderung gegenueber origin/main."
              pushed=1
              break
            fi
            git commit -m "Wahrheits-Abgleich $(date -u '+%Y-%m-%d')"
            if git push origin main; then
              echo "truth-check gepusht (Versuch $attempt)."
              pushed=1
              break
            fi
            echo "push rejected (Versuch $attempt) — neu fetchen und retry."
            sleep 2
          done
          if [ "$pushed" -ne 1 ]; then
            echo "ERROR: truth-check konnte nach 5 Versuchen nicht gepusht werden."
            exit 1
          fi
