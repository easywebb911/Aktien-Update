name: Diagnose NYSE API-Endpunkt Probe — market-Werte + Archiv? (read-only)

# Wegwerf-Probe, Folge-Probe zu #527 (Muster #510/#515/#522). Der vorige Lauf
# (Probe „NYSE Reg-SHO-Quelle") fand in der EIGENEN ungefilterten href-Liste der
# Threshold-Übersichtsseite den echten Download-Endpunkt (JS-gerendert, deshalb
# kein statischer Datei-Link):
#   /api/regulatory/threshold-securities/download?selectedDate=&market=
#
# ⚠ NACHSCHÄRFUNG (Lauf 15.08.2026): der ERSTE Lauf dieser Probe zeigte bereits
# einen ECHTEN Erfolg in Schritt 4 (Archiv-Test) — HTTP 200, sauberer Pipe-Header
# „Symbol|Security Name|Market Category|Reg SHO Threshold Flag|Filler|Filler",
# Zeilen wie BFLY/NYSE, BMNZ/NYSE Arca. Der ursprüngliche Verdikt-Block zählte
# aber NUR Schritt 1+2 (die alle mit leerem selectedDate scheitern → HTTP 500 —
# der Endpunkt verlangt ein gefülltes ``selectedDate`` im ISO-Format; leer → 500,
# US-Format → 400) und ignorierte den Erfolg in Schritt 4. Diese Version:
#   1) korrigiert den Verdikt: JA sobald IRGENDEIN Schritt 200+parsebar liefert
#      (gepoolte Auswertung über Schritt 1+2, 4 UND das neue Schritt 5).
#   2) NEU Schritt 5 — heutiges Datum, gestern, letzter Werktag (ISO, das jetzt
#      bestätigt funktionierende Format) — das ist die produktionsrelevante
#      Frage: liefert der Endpunkt AKTUELLE Daten oder nur Archiv?
#   3) NEU: Trefferquote + „Market Category"-Werte für JEDEN erfolgreichen
#      Abruf geloggt (Familien-Abdeckung NYSE/NYSE Arca/NYSE American).
#   4) NEU: gepaarter Vergleich market='' vs. market=<Kandidat> bei GLEICHEM
#      Datum — klärt, ob der market-Parameter überhaupt etwas filtert.
#
# Eigene Datei statt Erweiterung von #527s Probe — Single-Responsibility, das
# Original bleibt als Beleg für den Endpunkt-Fund unangetastet (Easy-Entscheid:
# „NICHT aufräumen, erweitern ODER zweite Datei — dein Vorschlag").
#
# HYGIENE: jeder Abruf einzeln in try/except; FETCH-FAIL (Exception/non-200)
# GETRENNT von LEER (200, aber 0 Zeilen) geloggt und gezählt. sleep zwischen
# Abrufen. none-Ticker (aktuell: ABX/IBTA/NMAX/NRGV/SPCE/WOLF) kommen zur
# Laufzeit aus reg_sho_history.json — NICHTS hartkodiert. Verdikt-Block am Ende,
# 4 Zeilen. UNBESTIMMT wo eine Frage offen bleibt.
#
# contents:read, workflow_dispatch-only, KEINE Secrets, KEIN Repo-Write.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      OUT_DIR: ${{ github.workspace }}/nyse-api-endpoint-out

    steps:
      - name: Checkout (contents:read — reg_sho_history.json für none-Ticker lesen)
        uses: actions/checkout@v4

      - name: Prepare output dir
        run: mkdir -p "$OUT_DIR"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe — NYSE-API-Endpunkt (read-only, stdlib only)
        run: |
          python - <<'PY'
          import hashlib, json, os, re, sys, time
          from datetime import datetime, timedelta, timezone
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from urllib.parse import urlencode

          OUT = os.environ["OUT_DIR"]
          # Wegwerf-Kontakt für eine einmalige Diagnose-Probe (kein Secret, .invalid
          # per RFC 2606 reserviert → keine reale Adresse; analog #522/#527-Entscheid).
          UA = ("SqueezeReportProbe/1.0 (read-only research; "
                "throwaway contact squeeze-report-diagnose-probe@example.invalid) "
                "Mozilla/5.0")
          OVERVIEW_URL = "https://www.nyse.com/regulation/threshold-securities"
          # Der Endpunkt selbst ist NICHT geraten — er stand als href in der
          # ungefilterten Link-Liste der Probe #527 auf genau dieser Übersichtsseite.
          ENDPOINT = "https://www.nyse.com/api/regulatory/threshold-securities/download"
          # Fallback-market-Kandidaten (nur genutzt, wenn Schritt 0 nichts auf der
          # Seite findet) — explizit als unbestätigt markiert (Lehre #496).
          _FALLBACK_MARKET_CANDIDATES = ("NYSE", "NYSE American", "NYSE Arca",
                                        "NYSEAMERICAN", "NYSEARCA", "AMEX", "ARCA")

          def log(m): print(m, flush=True)

          def fetch(url, *, timeout=20, referer=None):
              """(status:int|None, body:bytes|None, content_type:str|None, error:str|None).
              FETCH-FAIL := error gesetzt (Exception/HTTPError). Getrennt von LEER
              (status 200, aber 0 Zeilen — das prüft der Caller)."""
              headers = {"User-Agent": UA, "Accept": "*/*"}
              if referer:
                  headers["Referer"] = referer
              req = Request(url, headers=headers)
              try:
                  with urlopen(req, timeout=timeout) as r:
                      raw = r.read()
                      st = getattr(r, "status", r.getcode())
                      ct = r.headers.get("Content-Type") if hasattr(r, "headers") else None
                      return st, raw, ct, None
              except HTTPError as e:
                  return e.code, None, None, f"HTTPError {e.code}"
              except Exception as e:
                  return None, None, None, f"{type(e).__name__}: {e}"

          def probe_endpoint(label, url):
              """Ein einzelner Endpunkt-Abruf, VOLLSTÄNDIG geloggt (auch Fehlschläge).
              Returns (status:'ok'|'leer'|'fetch_failed', ct, text:str|None).
              FETCH-FAIL (Exception/non-200) STRIKT von LEER (HTTP 200, aber 0 Bytes/
              0 Zeilen) getrennt."""
              st, body, ct, err = fetch(url, referer=OVERVIEW_URL)
              if err:
                  log(f"[ENDPOINT] {label} FETCH-FAIL: {url} → {err}")
                  return "fetch_failed", None, None
              if st != 200:
                  log(f"[ENDPOINT] {label} FETCH-FAIL: HTTP {st} (nicht 200) — {url}")
                  return "fetch_failed", None, None
              if not body:
                  log(f"[ENDPOINT] {label} → LEER (HTTP 200, 0 Bytes) — {url}")
                  return "leer", None, None
              text = body.decode("utf-8", "replace")
              lines = [l for l in text.splitlines() if l.strip()]
              log(f"[ENDPOINT] {label} HTTP 200 · Content-Type={ct} · "
                  f"{len(body)} Bytes · {len(lines)} Zeilen")
              for l in lines[:5]:
                  log(f"            {l!r}")
              if not lines:
                  log(f"[ENDPOINT] {label} → LEER (HTTP 200, 0 Zeilen)")
                  return "leer", ct, text
              return "ok", ct, text

          def extract_symbols_and_markets(text):
              """(symbols:set, market_category_counts:dict, header:str|None).
              Spalten per HEADER-NAME gesucht (robust gegen Reihenfolge-Änderung),
              Fallback auf die real beobachtete Position (Symbol=0, Market
              Category=2: 'Symbol|Security Name|Market Category|Reg SHO Threshold
              Flag|Filler|Filler')."""
              lines = [l for l in text.splitlines() if l.strip()]
              if not lines:
                  return set(), {}, None
              header = lines[0]
              sep = "|" if "|" in header else ("," if "," in header else None)
              cols = [c.strip() for c in (header.split(sep) if sep else header.split())]
              def _idx(name, default):
                  for i, c in enumerate(cols):
                      if c.strip().lower() == name:
                          return i
                  return default
              i_sym = _idx("symbol", 0)
              i_mkt = _idx("market category", 2)
              syms = set()
              mkt_counts = {}
              for l in lines[1:]:
                  parts = l.split(sep) if sep else l.split()
                  if len(parts) <= i_sym:
                      continue
                  s = parts[i_sym].strip().upper()
                  if s and s.isalpha():
                      syms.add(s)
                  if len(parts) > i_mkt:
                      m = parts[i_mkt].strip()
                      if m:
                          mkt_counts[m] = mkt_counts.get(m, 0) + 1
              return syms, mkt_counts, header

          # ── none-Ticker zur Laufzeit aus reg_sho_history.json (nichts hartkodiert) ─
          none_tickers = {}
          try:
              hist = json.load(open("reg_sho_history.json", encoding="utf-8"))
              newest = {}
              for tk, pts in hist.items():
                  for p in pts:
                      if not isinstance(p, dict):
                          continue
                      d = p.get("date")
                      if d and (tk not in newest or d > newest[tk].get("date", "")):
                          newest[tk] = p
              for tk, p in newest.items():
                  if p.get("restricted") is None:
                      none_tickers[tk] = {"exchange": p.get("exchange"),
                                          "reason": p.get("reason")}
          except Exception as e:
              log(f"WARN: reg_sho_history.json nicht lesbar: {e}")
          log(f"### none-Ticker (Laufzeit, aus reg_sho_history.json): {len(none_tickers)}")
          for tk, info in sorted(none_tickers.items()):
              log(f"    {tk}: {info}")
          log("=" * 70)

          # Gepoolte Sammlung ALLER erfolgreichen ('ok') Abrufe über SÄMTLICHE
          # Schritte — DAS ist die Korrektur: der Verdikt zählt am Ende diesen
          # Pool, nicht nur einen einzelnen Schritt.
          all_ok_fetches = []   # [{"label", "market", "date", "text"}, ...]

          # ══════════════════════════════════════════════════════════════════════
          # SCHRITT 0 — Übersichtsseite nach erlaubten market-Werten durchsuchen
          # ══════════════════════════════════════════════════════════════════════
          log("\n########## SCHRITT 0 — market-Werte auf der Seite suchen ##########")
          market_hints = []   # [(value, provenance)]
          st0, body0, ct0, err0 = fetch(OVERVIEW_URL)
          if err0:
              log(f"[ÜBERSICHT] FETCH-FAIL: {OVERVIEW_URL} → {err0}")
          elif st0 != 200 or not body0:
              log(f"[ÜBERSICHT] HTTP {st0}/leer: {OVERVIEW_URL}")
          else:
              html = body0.decode("utf-8", "replace")
              log(f"[ÜBERSICHT] HTTP 200 · {len(html)} Zeichen")
              opts = re.findall(
                  r'<option[^>]*value=["\']([^"\']*)["\'][^>]*>([^<]*)</option>', html, re.I)
              for val, txt in opts:
                  log(f"            <option> value={val!r} text={txt.strip()!r}")
                  if val.strip() and val.strip() not in [v for v, _ in market_hints]:
                      market_hints.append((val.strip(), "von <option> extrahiert"))
              near = re.findall(r'market["\']?\s*[:=]\s*["\']([^"\']{1,40})["\']', html, re.I)
              for v in near:
                  log(f"            market-naher Quoted-Token: {v!r}")
                  if v and v not in [x for x, _ in market_hints]:
                      market_hints.append((v, "market-naher Token extrahiert"))
              if not opts and not near:
                  log("            keine <option>-Tags, keine market-nahen Tokens gefunden.")
          log("=" * 70)

          # ══════════════════════════════════════════════════════════════════════
          # SCHRITT 1+2 — Baseline + market-Werte, JEDE Antwort geloggt
          # ══════════════════════════════════════════════════════════════════════
          # BEKANNT (aus dem ersten Lauf dieser Probe): der Endpunkt verlangt ein
          # gefülltes selectedDate im ISO-Format — leer → HTTP 500. Diese Schleife
          # nutzt bewusst weiterhin selectedDate='' (unverändert, dokumentarisch —
          # zeigt den vollständigen Fehlschlag-Grund unabhängig vom market-Wert).
          # Die eigentliche Erfolgs-Prüfung passiert in Schritt 4/5 mit echtem Datum.
          log("\n########## SCHRITT 1+2 — Baseline + market-Kandidaten "
              "(selectedDate LEER — erwartet HTTP 500, siehe Kopf-Kommentar) ##########")
          MAX_MARKET_HINTS = 12
          if len(market_hints) > MAX_MARKET_HINTS:
              log(f"[SCHRITT 1+2] {len(market_hints)} market-Hints von der Seite gefunden "
                  f"— gecappt auf die ersten {MAX_MARKET_HINTS} (Rest verworfen, NICHT "
                  f"stillschweigend): {[v for v, _ in market_hints[MAX_MARKET_HINTS:]]}")
          market_hints = market_hints[:MAX_MARKET_HINTS]

          candidates = [("", "Baseline: leer, wie im HTML")]
          for val, prov in market_hints:
              candidates.append((val, f"von Seite ({prov})"))
          if not market_hints:
              for v in _FALLBACK_MARKET_CANDIDATES:
                  candidates.append((v, "Kandidat, NICHT von der Seite bestätigt"))

          n_fetchfail_12 = n_leer_12 = n_ok_12 = 0
          for val, prov in candidates:
              url = f"{ENDPOINT}?{urlencode({'selectedDate': '', 'market': val})}"
              label = f"market={val!r} ({prov}), selectedDate=leer"
              status, ct, text = probe_endpoint(label, url)
              if status == "fetch_failed":
                  n_fetchfail_12 += 1
              elif status == "leer":
                  n_leer_12 += 1
              else:
                  n_ok_12 += 1
                  all_ok_fetches.append({"label": label, "market": val, "date": "",
                                         "text": text})
              time.sleep(1.2)
          log(f"\n[ZUSAMMENFASSUNG SCHRITT 1+2] {len(candidates)} Werte probiert · "
              f"{n_ok_12} ok · {n_leer_12} leer · {n_fetchfail_12} fetch-fail")
          log("=" * 70)

          # ══════════════════════════════════════════════════════════════════════
          # SCHRITT 4 — Archiv-Test (Werktag ~14 Tage zurück, beide Datumsformate)
          # ══════════════════════════════════════════════════════════════════════
          log("\n########## SCHRITT 4 — Archiv-Test (Werktag ~14 Tage zurück) ##########")
          now = datetime.now(timezone.utc)
          log(f"Laufzeit-Stempel (UTC, zur Auditierung — kein hartkodierter Wert): "
              f"{now.strftime('%Y-%m-%dT%H:%M:%SZ')}")
          archive_target = now - timedelta(days=14)
          while archive_target.weekday() >= 5:   # 5=Sa, 6=So
              archive_target -= timedelta(days=1)
          archive_date_iso = archive_target.strftime("%Y-%m-%d")
          archive_date_us = archive_target.strftime("%m/%d/%Y")
          log(f"Ziel-Datum (Werktag, ~14 Tage zurück, zur Laufzeit berechnet): "
              f"{archive_date_iso} (US-Format {archive_date_us})")

          archive_market = ""   # unfiltered — Produktionsfrage zuerst, market-Frage separat (Schritt 5)
          baseline_hash = None
          for date_label, date_val in [("ISO YYYY-MM-DD", archive_date_iso),
                                        ("US MM/DD/YYYY", archive_date_us)]:
              url = f"{ENDPOINT}?{urlencode({'selectedDate': date_val, 'market': archive_market})}"
              label = f"Archiv selectedDate={date_val!r} ({date_label}), market={archive_market!r}"
              status, ct, text = probe_endpoint(label, url)
              if status == "ok" and text:
                  h = hashlib.sha256(text.encode()).hexdigest()[:12]
                  log(f"            Hash={h}")
                  all_ok_fetches.append({"label": label, "market": archive_market,
                                         "date": date_val, "text": text})
                  if date_label.startswith("ISO"):
                      baseline_hash = h   # ISO ist das bestätigte Format → als Vergleichsbasis
              time.sleep(1.2)
          log("=" * 70)

          # ══════════════════════════════════════════════════════════════════════
          # SCHRITT 5 (NEU) — heutiges Datum, gestern, letzter Werktag (ISO)
          # ══════════════════════════════════════════════════════════════════════
          # DIE produktionsrelevante Frage: liefert der Endpunkt AKTUELLE Daten
          # oder nur Archiv? ISO-Format (bestätigt funktionierend aus Schritt 4).
          log("\n########## SCHRITT 5 — heute/gestern/letzter Werktag (ISO) ##########")
          date_today = now.date()
          date_yesterday = date_today - timedelta(days=1)
          _lw = date_yesterday
          while _lw.weekday() >= 5:
              _lw -= timedelta(days=1)
          date_last_workday = _lw
          log(f"Berechnete Daten (aus dem Laufzeit-Stempel oben, KEIN Rückdatum): "
              f"heute={date_today.isoformat()} gestern={date_yesterday.isoformat()} "
              f"letzter_werktag={date_last_workday.isoformat()}")

          # Repräsentativer market-Wert für den gepaarten Vergleich (Punkt 3):
          # von der Seite bestätigt, falls vorhanden — sonst erster Fallback-Kandidat.
          representative_market = (market_hints[0][0] if market_hints
                                   else _FALLBACK_MARKET_CANDIDATES[0])

          near_dates = [("heute", date_today.isoformat()),
                       ("gestern", date_yesterday.isoformat()),
                       ("letzter Werktag", date_last_workday.isoformat())]
          paired_results = {}   # date_iso -> {"": text|None, representative_market: text|None}
          for date_name, date_iso in near_dates:
              paired_results[date_iso] = {}
              # (a) unfiltered — die Kernfrage
              url = f"{ENDPOINT}?{urlencode({'selectedDate': date_iso, 'market': ''})}"
              label = f"{date_name} ({date_iso}), market='' (unfiltered)"
              status, ct, text = probe_endpoint(label, url)
              if status == "ok" and text:
                  all_ok_fetches.append({"label": label, "market": "", "date": date_iso,
                                         "text": text})
                  paired_results[date_iso][""] = text
              time.sleep(1.2)
              # (b) mit market=<repräsentativ> — für den Punkt-3-Vergleich
              url2 = f"{ENDPOINT}?{urlencode({'selectedDate': date_iso, 'market': representative_market})}"
              label2 = f"{date_name} ({date_iso}), market={representative_market!r} (gepaart)"
              status2, ct2, text2 = probe_endpoint(label2, url2)
              if status2 == "ok" and text2:
                  all_ok_fetches.append({"label": label2, "market": representative_market,
                                         "date": date_iso, "text": text2})
                  paired_results[date_iso][representative_market] = text2
              time.sleep(1.2)
          log("=" * 70)

          # ── Punkt 3: ist der market-Parameter überhaupt nötig? ──────────────────
          log("\n########## AUSWERTUNG — ist market= nötig? (gepaarter Vergleich) ##########")
          market_param_verdict = "UNBESTIMMT — kein gepaartes Erfolgspaar (market='' UND market=<Wert>, gleiches Datum) vorhanden"
          for date_iso, pair in paired_results.items():
              if "" in pair and representative_market in pair:
                  syms_empty, mkts_empty, _ = extract_symbols_and_markets(pair[""])
                  syms_filt, mkts_filt, _ = extract_symbols_and_markets(pair[representative_market])
                  same = syms_empty == syms_filt
                  subset = syms_filt.issubset(syms_empty)
                  log(f"[VERGLEICH {date_iso}] market='': {len(syms_empty)} Symbole "
                      f"(Market-Category-Werte: {sorted(mkts_empty)}) · "
                      f"market={representative_market!r}: {len(syms_filt)} Symbole "
                      f"(Market-Category-Werte: {sorted(mkts_filt)}) · "
                      f"identisch={same} · gefiltert⊆unfiltered={subset}")
                  if same:
                      market_param_verdict = (
                          f"NICHT NÖTIG — market='' und market={representative_market!r} "
                          f"liefern identische Symbol-Mengen am {date_iso} "
                          f"({len(mkts_empty)} Market-Category-Werte bereits ohne Filter: "
                          f"{sorted(mkts_empty)})")
                  elif subset and len(syms_filt) < len(syms_empty):
                      market_param_verdict = (
                          f"NÖTIG/WIRKSAM — market={representative_market!r} filtert am "
                          f"{date_iso} auf {len(syms_filt)}/{len(syms_empty)} Symbole "
                          f"(echte Teilmenge)")
                  else:
                      market_param_verdict = (
                          f"UNKLAR — Symbol-Mengen am {date_iso} weder identisch noch "
                          f"sauber verschachtelt (market='' {len(syms_empty)}, "
                          f"market={representative_market!r} {len(syms_filt)})")
                  break   # ein aussagekräftiges Paar reicht
          if market_param_verdict.startswith("UNBESTIMMT"):
              # Fallback: wenigstens EIN market=''-Erfolg auswerten (Market-Category-
              # Diversität als schwächerer, aber noch aussagekräftiger Beleg).
              for entry in all_ok_fetches:
                  if entry["market"] == "":
                      syms, mkts, _ = extract_symbols_and_markets(entry["text"])
                      if len(mkts) >= 2:
                          market_param_verdict = (
                              f"VERMUTLICH NICHT NÖTIG (schwächerer Beleg, kein "
                              f"gepaarter Vergleich) — market='' bei {entry['label']} "
                              f"enthält bereits {len(mkts)} Market-Category-Werte: "
                              f"{sorted(mkts)}")
                      break
          log(f"[PUNKT 3] {market_param_verdict}")
          log("=" * 70)

          # ══════════════════════════════════════════════════════════════════════
          # SCHRITT 6 — Gepoolte Auswertung: Trefferquote + Market-Category (ALLE Schritte)
          # ══════════════════════════════════════════════════════════════════════
          log(f"\n########## SCHRITT 6 — Gepoolte Auswertung ({len(all_ok_fetches)} "
              f"erfolgreiche Abrufe über alle Schritte) ##########")
          best = None
          for entry in all_ok_fetches:
              syms, mkts, header = extract_symbols_and_markets(entry["text"])
              hits = sorted(set(none_tickers) & syms)
              log(f"[POOL] {entry['label']}: {len(syms)} Symbole · Spaltenkopf {header!r} · "
                  f"Treffer {len(hits)}/{len(none_tickers)} → {hits} · "
                  f"Market-Category-Werte: {sorted(mkts)}")
              if best is None or len(hits) > len(best["hits"]) or (
                      len(hits) == len(best["hits"]) and syms and
                      len(syms) > best["n_syms"]):
                  best = {"label": entry["label"], "header": header,
                         "n_syms": len(syms), "hits": hits, "mkts": mkts}
          log("=" * 70)

          # ── Verdikt-Block (4 Zeilen, kopierbar) — GEPOOLT über ALLE Schritte ────
          log("\n" + "=" * 70)
          log("VERDIKT-BLOCK (kopierbar):")
          n_ok_total = len(all_ok_fetches)
          if n_ok_total > 0:
              log(f"1) Endpunkt liefert: JA — {n_ok_total} erfolgreiche Abrufe über alle "
                  f"Schritte (Schritt 1+2 leeres Datum: {n_ok_12}/{len(candidates)} — "
                  f"Rest: {n_ok_total - n_ok_12} mit gefülltem ISO-Datum)")
          else:
              log(f"1) Endpunkt liefert: NEIN — 0 erfolgreiche Abrufe über alle Schritte")
          if best:
              log(f"2) Format: {best['label']} · Spaltenkopf {best['header']!r} · "
                  f"{best['n_syms']} Symbole")
              log(f"3) Trefferquote/Plausibilität: {len(best['hits'])}/{len(none_tickers)} "
                  f"none-Ticker auf der Liste → {best['hits']} (6/6 NICHT erwartet — "
                  f"entscheidend ist Symbol-Konvention + Market-Category-Abdeckung "
                  f"{sorted(best['mkts'])}) · market=-Parameter: {market_param_verdict}")
          else:
              log("2) Format: UNBESTIMMT — kein auswertbares Ergebnis")
              log(f"3) Trefferquote/Plausibilität: UNBESTIMMT — keine Liste zum Prüfen · "
                  f"market=-Parameter: {market_param_verdict}")
          if n_ok_total > 0:
              today_ok = any(e["date"] == date_today.isoformat() for e in all_ok_fetches)
              log(f"4) Archiv+Aktualität: archiv-datiert (~14T) "
                  f"{'erfolgreich' if baseline_hash else 'kein ISO-Erfolg'} · "
                  f"HEUTE ({date_today.isoformat()}) {'LIEFERT DATEN' if today_ok else 'LIEFERT NICHTS/FEHLGESCHLAGEN'}")
          else:
              log("4) Archiv+Aktualität: UNBESTIMMT — Endpunkt lieferte in KEINEM Schritt etwas")

          # ── Artefakt ─────────────────────────────────────────────────────────────
          try:
              with open(os.path.join(OUT, "probe_summary.json"), "w") as fh:
                  json.dump({
                      "none_tickers": none_tickers,
                      "market_hints": market_hints,
                      "n_ok_total": n_ok_total, "n_ok_step12": n_ok_12,
                      "best": best, "market_param_verdict": market_param_verdict,
                      "archive_date_iso": archive_date_iso,
                      "date_today": date_today.isoformat(),
                      "date_yesterday": date_yesterday.isoformat(),
                      "date_last_workday": date_last_workday.isoformat(),
                  }, fh, indent=2, default=str)
          except Exception:
              pass
          PY

      - name: Upload output als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyse-api-endpoint-probe
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
