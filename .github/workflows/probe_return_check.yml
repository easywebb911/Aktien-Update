name: Probe Rendite-Check (Wegwerf, read-only)

# WEGWERF-PROBE Rendite-Diagnose (Easy-Entscheid 02.11.2026, Freeze-Auto-Lauf
# pausiert mit #644). Prüft, ob return_3d/5d/10d aus dem LAUFENDEN Handelstag
# T+N stammen, und misst die Abweichung gespeichert vs. echter Schlusskurs.
#
# BLINDUNG: das Skript gibt KEINE Renditewerte aus, gruppiert NICHT nach
# Score/Bucket/Regime/Haltedauer und erzeugt KEINE Freeze-Auswertung — nur
# Füll-Zeitpunkte und die Verteilung |gespeichert − korrekt| in pp.
#
# Nur workflow_dispatch · permissions contents: read · KEINE Secrets ·
# KEIN Commit, KEIN Push, KEIN Artefakt · Ausgabe nur ins Log.
# Rückweg: Datei + scripts/probe_return_check.py löschen (eigener PR).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (volle Historie für Füll-Zeitpunkte)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rendite-Check (blind, nur Log)
        run: python scripts/probe_return_check.py --online
