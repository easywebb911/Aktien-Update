name: Diagnose Wiki-Attention Probe (read-only)

# Read-only Machbarkeits-Probe für den geplanten attention_wiki-Feed
# (Wikipedia-Pageviews als point-in-time Attention-Proxy). Misst die fünf
# Fragen der Probe gegen die ECHTEN keyless Wikimedia/Wikidata-APIs vom
# GitHub-Actions-Runner aus (die interaktive Sandbox ist egress-deny-all).
#
# KEINE Secrets. KEINE Repo-Writes. Wikimedia-User-Agent-Policy respektiert.
# Analog diagnose_provider_probe.yml (6c-EDGAR-Muster). Output ins Run-Log +
# Artefakt. NACH der Messung wieder entfernen (throwaway).
#
# Trigger ausschließlich workflow_dispatch (manuell).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runner egress info
        run: |
          echo "## Runner public IP"; curl -sS --max-time 5 https://api.ipify.org || true; echo
      - name: Run Wiki-Attention probe
        run: |
          python scripts/diagnose/wiki_attention_probe.py \
            scripts/diagnose/wiki_probe_universe.json | tee probe_out.txt
      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-attention-probe-log
          path: probe_out.txt
