name: Diagnose yfinance Institutional-Ownership — Key + Coverage + Streuung (read-only)

# Wegwerf-Probe (Muster #448/#449). Klärt EMPIRISCH aus dem Actions-Runner
# (die Claude-Sandbox ist egress-geblockt) DREI Fragen in EINEM Lauf, bevor
# entschieden wird, ob ein forward-only inst_ownership-Sammelfeld gebaut wird:
#
#   1. WELCHER KEY TRÄGT? Das im Daily verdrahtete inst_ownership liefert 0 %
#      Coverage über 1752 Backtest-Einträge — Verdacht: falsche .info-Keys
#      (Code liest institutionHeldPercentOutstanding/institutionsPercentHeld,
#      Standard-yfinance-Key wäre heldPercentInstitutions). Large-Caps müssen
#      einen Wert haben → zeigt sofort, welcher Key trägt. Zusätzlich werden
#      ALLE .info-Keys mit "held"/"instit"/"insider" gedumpt (falls yfinance
#      umbenannt hat, sehen wir den echten Namen ohne zweite Probe).
#   2. REALE COVERAGE am eigenen Universum (heutige Top-10 + jüngste Backtest-
#      Ticker, beide zur LAUFZEIT aus den Repo-Dateien, nichts hartkodiert).
#   3. STREUUNG (min/max/Median/Quartile) — die Entscheidungszahl für den
#      Dämpfer: ohne Spread ist ein Dämpfer nicht messbar.
#
# KEINE Secrets. KEINE Repo-Writes. contents: read (nur Checkout, um die
# Ticker-Listen zu lesen). Reine .info-Calls via yfinance. Output im Run-Log
# + als Artefakt. Trigger: workflow_dispatch only. Rate-limit/leer → im Log
# AUSGEWIESEN (FETCH-FAIL), nicht gefaked. Rückweg: Cleanup-PR löscht die Datei.

on:
  workflow_dispatch:
    inputs:
      large_caps:
        description: "Large-Caps (Wert MUSS existieren) — Key-Test"
        required: false
        default: "AAPL,MSFT,JPM"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      OUT_DIR: ${{ github.workspace }}/inst-own-probe-out
      LARGE_CAPS: ${{ github.event.inputs.large_caps }}

    steps:
      - name: Checkout main (nur lesen — für die Ticker-Listen)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Prepare output dir
        run: mkdir -p "$OUT_DIR"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yfinance
        run: |
          python -m pip install --upgrade pip
          pip install yfinance
          echo "yfinance-Version:"
          python -c "import yfinance, sys; print(yfinance.__version__)"

      - name: Probe — Institutional-Ownership (Key + Coverage + Streuung)
        run: |
          python - <<'PY'
          import json, os, sys, time, statistics

          try:
              import yfinance as yf
          except Exception as exc:
              print(f"FATAL: yfinance-Import fehlgeschlagen: {exc}")
              sys.exit(0)

          WS      = os.environ.get("GITHUB_WORKSPACE", ".")
          OUT_DIR = os.environ["OUT_DIR"]
          LARGE   = [t.strip().upper() for t in
                     os.environ.get("LARGE_CAPS", "AAPL,MSFT,JPM").split(",") if t.strip()]

          # Kandidaten-Keys: die zwei aktuell verdrahteten + Standard + Insider.
          KEYS = [
              "institutionHeldPercentOutstanding",  # aktuell verdrahtet (primär)
              "institutionsPercentHeld",            # aktuell verdrahtet (fallback)
              "heldPercentInstitutions",            # Standard-yfinance-Key (Hypothese)
              "heldPercentInsiders",                # Insider-Achse
          ]
          SHORT = {
              "institutionHeldPercentOutstanding": "instHeldPctOut",
              "institutionsPercentHeld":           "instPctHeld",
              "heldPercentInstitutions":           "heldPctInst",
              "heldPercentInsiders":               "heldPctInsid",
          }

          def pct(v):
              try:
                  return f"{float(v)*100:.1f}%"
              except Exception:
                  return "—"

          def is_num(v):
              return isinstance(v, (int, float)) and not isinstance(v, bool)

          def fetch_info(t):
              """(.info-dict, None) bei Erfolg; (None, grund) bei Fehler/leer.
              Fetch-Fail (Exception/leeres Dict) ist bewusst von Key-liefert-None
              getrennt — die Unterscheidung ist die halbe Diagnose."""
              err = None
              for _ in (1, 2):
                  try:
                      info = yf.Ticker(t).info
                      if info:
                          return info, None
                      err = "leeres .info-Dict (rate-limit?)"
                  except Exception as exc:
                      err = f"{type(exc).__name__}: {exc}"
                  time.sleep(0.5)
              return None, err

          def line(t, info, keys):
              parts = [t]
              for k in keys:
                  if k in info:
                      v = info.get(k)
                      parts.append(f"{SHORT.get(k, k)}={v!r}({pct(v)})")
                  else:
                      parts.append(f"{SHORT.get(k, k)}=<KEY-FEHLT>")
              return " | ".join(parts)

          def load_universe():
              top10, recent = [], []
              try:
                  ad = json.load(open(os.path.join(WS, "app_data.json")))
                  top10 = list((ad.get("top10_metrics") or {}).keys())
                  if not top10:
                      top10 = list((ad.get("watchlist_cards") or {}).keys())
                  print(f"[universe] Top-10 aus app_data.json ({len(top10)}): {top10}")
              except Exception as e:
                  print(f"[universe] WARN app_data.json nicht lesbar: {e}")
              try:
                  bh = json.load(open(os.path.join(WS, "backtest_history.json")))
                  def kf(ds):
                      try:
                          d, m, y = ds.split(".")
                          return (int(y), int(m), int(d))
                      except Exception:
                          return (0, 0, 0)
                  rows = [e for e in bh if isinstance(e, dict)
                          and e.get("ticker") and e.get("date")]
                  rows.sort(key=lambda e: kf(e["date"]), reverse=True)
                  seen = set(t.upper() for t in top10)
                  for e in rows:
                      t = str(e["ticker"]).upper()
                      if t not in seen:
                          seen.add(t); recent.append(t)
                      if len(recent) >= 20:
                          break
                  print(f"[universe] {len(recent)} jüngste Backtest-Ticker "
                        f"(dedupe, ohne Top-10): {recent}")
              except Exception as e:
                  print(f"[universe] WARN backtest_history.json nicht lesbar: {e}")
              return top10, recent

          collected   = {}
          fetch_fails = []
          discovered  = []   # umbenannte Keys, die bei Large-Caps Werte tragen

          # ── FRAGE 1: WELCHER KEY TRÄGT? (Large-Caps) ──────────────────────
          print("=" * 72)
          print("### FRAGE 1 — WELCHER KEY TRÄGT (Large-Caps, Wert MUSS existieren) ###")
          for t in LARGE:
              info, err = fetch_info(t)
              if info is None:
                  print(f"FETCH-FAIL {t} {err}")
                  fetch_fails.append(t); time.sleep(0.8); continue
              print(line(t, info, KEYS))
              matches = {k: info[k] for k in info
                         if any(s in k.lower() for s in ("held", "instit", "insider"))}
              print(f"  [.info-Keys mit held/instit/insider]: {matches}")
              for k, v in matches.items():
                  if k not in KEYS and is_num(v) and k not in discovered:
                      discovered.append(k)   # so einen echten umbenannten Key messen wir mit
              collected[t] = {k: info.get(k) for k in KEYS}
              collected[t].update({k: info.get(k) for k in discovered})
              time.sleep(0.8)

          MEASURE_KEYS = KEYS + [k for k in discovered if k not in KEYS]
          if discovered:
              print(f"[hinweis] zusätzlich gemessene (umbenannte?) Keys: {discovered}")

          # ── FRAGE 2: REALE COVERAGE am eigenen Universum ──────────────────
          top10, recent = load_universe()
          universe = list(dict.fromkeys([*top10, *recent]))  # dedupe, stabile Reihenfolge
          print("=" * 72)
          print(f"### FRAGE 2 — COVERAGE AM EIGENEN UNIVERSUM ({len(universe)} Ticker) ###")
          for t in universe:
              info, err = fetch_info(t)
              if info is None:
                  print(f"FETCH-FAIL {t} {err}")
                  fetch_fails.append(t); time.sleep(0.8); continue
              print(line(t, info, MEASURE_KEYS))
              # Belt-and-suspenders: falls ein (umbenannter) held/instit/insider-Key
              # NUR bei Universum-Tickern trägt (bei Large-Caps null war), hier roh
              # zeigen — dann bleibt der Lauf trotzdem selbst-genügsam (keine 2. Probe).
              _extra = {k: info[k] for k in info
                        if any(s in k.lower() for s in ("held", "instit", "insider"))
                        and k not in MEASURE_KEYS}
              if _extra:
                  print(f"  [.info-Extra-Keys mit held/instit/insider]: {_extra}")
              collected[t] = {k: info.get(k) for k in MEASURE_KEYS}
              time.sleep(0.8)

          # Artefakt-Dump (roh).
          try:
              with open(os.path.join(OUT_DIR, "inst_ownership_probe.json"), "w") as fh:
                  json.dump(collected, fh, indent=2, default=str)
          except Exception as e:
              print(f"WARN Artefakt-Dump: {e}")

          # ── FRAGE 3: STREUUNG (pro Key, NUR Universum-Ticker mit Wert) ────
          uni_recs = {t: collected[t] for t in universe if t in collected}
          def numvals(k):
              return sorted(float(rec[k]) for rec in uni_recs.values()
                            if is_num(rec.get(k)))
          print("=" * 72)
          print("### FRAGE 3 — STREUUNG (pro Key, nur Universum-Ticker mit Wert) ###")
          cover = {}
          for k in MEASURE_KEYS:
              vs = numvals(k)
              cover[k] = (len(vs), len(uni_recs))
              if vs:
                  med = statistics.median(vs)
                  if len(vs) >= 2:
                      q = statistics.quantiles(vs, n=4)  # [Q1, Q2, Q3]
                      q1, q3 = q[0], q[2]
                  else:
                      q1 = q3 = med
                  print(f"  {SHORT.get(k, k)}: n={len(vs)}/{len(uni_recs)} | "
                        f"min={pct(vs[0])} Q1={pct(q1)} Median={pct(med)} "
                        f"Q3={pct(q3)} max={pct(vs[-1])}")
              else:
                  print(f"  {SHORT.get(k, k)}: n=0/{len(uni_recs)} — kein Wert (Streuung n/a)")

          # ── 4-ZEILEN-ZUSAMMENFASSUNG (notfalls reicht Easy dieser Block) ──
          print("=" * 72)
          print("===== ZUSAMMENFASSUNG (4 Zeilen) =====")
          lc = []
          for t in LARGE:
              rec = collected.get(t, {})
              lc.append(f"{t}[heldPctInst={pct(rec.get('heldPercentInstitutions'))} "
                        f"instHeldPctOut={pct(rec.get('institutionHeldPercentOutstanding'))} "
                        f"instPctHeld={pct(rec.get('institutionsPercentHeld'))}]")
          print(f"1) KEY-VERDIKT (Large-Caps): {' '.join(lc) if lc else '— alle fetch-fail'}")
          print("2) COVERAGE Universum: "
                + " · ".join(f"{SHORT.get(k, k)}={cover[k][0]}/{cover[k][1]}"
                             for k in MEASURE_KEYS))
          best = max(MEASURE_KEYS, key=lambda k: cover[k][0]) if MEASURE_KEYS else None
          bv = numvals(best) if best else []
          if bv:
              print(f"3) STREUUNG best-covered '{SHORT.get(best, best)}': "
                    f"min={pct(bv[0])} Median={pct(statistics.median(bv))} "
                    f"max={pct(bv[-1])} (n={len(bv)})")
          else:
              print("3) STREUUNG: kein Key liefert Universum-Werte → nicht bestimmbar")
          print(f"4) FETCH-FAILS: {len(fetch_fails)} → {fetch_fails}")
          PY

      - name: Upload raw responses als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inst-ownership-probe
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
