name: Diagnose SSR-Flag Probe (read-only)

# Read-only Machbarkeits-Probe für ein geplantes forward-only `ssr`-Feld
# (Reg-SHO Rule 201 Short-Sale-Restriction: −10%-Intraday-Circuit-Breaker,
# gilt Rest des Tages + Folgetag). Misst die fünf Probe-Fragen gegen die
# ECHTEN keyless Venue-Listen (NasdaqTrader / Cboe / NYSE) vom GitHub-Actions-
# Runner aus — die interaktive Sandbox ist egress-deny-all.
#
# WICHTIG: Rule 201 SSR (Circuit-Breaker) ≠ Rule 203 Reg-SHO Threshold
# (FTD-Liste). Die Probe misst beide und trennt sie im Befund.
#
# KEINE Secrets. KEINE Repo-Writes. contents:read. Analog
# diagnose_wiki_attention_probe.yml (Wiki-Probe) / diagnose_provider_probe.yml
# (6c-EDGAR). Output ins Run-Log + Artefakt. NACH der Messung wieder entfernen
# (throwaway). Trigger ausschließlich workflow_dispatch (manuell).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runner egress info
        run: |
          echo "## Runner public IP"; curl -sS --max-time 5 https://api.ipify.org || true; echo
          echo "## Runner UTC"; date -u
      - name: Run SSR-Flag probe
        run: |
          python scripts/diagnose/ssr_probe.py \
            scripts/diagnose/ssr_probe_universe.json | tee ssr_probe_out.txt
      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssr-flag-probe-log
          path: ssr_probe_out.txt
