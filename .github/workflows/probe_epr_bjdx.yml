name: Probe epr + BJDX-Aktionen (Wegwerf)

# WEGWERF-MESSLAUF (Easy-Auftrag 13.11.2026). READ-ONLY: kein Commit, kein
# Push, keine Secrets, schreibt nichts ins Repo. Zwei Schritte:
#  1) scripts/probe_bjdx_actions.py — Yahoo-Aktionsdaten (Split-Datum, Faktor)
#     + Nachkommastellen der bereinigten Kurse für BJDX (S16 13.11.), AMCX, ARCT.
#  2) scripts/probe_epr_measure.py — entry_past_return_5d aller forward-Zeilen
#     gegen die Rechnung auf den eigenen Handelstagen (open_item
#     epr-gemeinsamer-index-vs-eigene-handelstage). BLINDHEIT: nur das
#     Prädiktor-Feld; ab 24.10.2026 nur Anzahlen/Größen.
# Ergebnis: Job-Log + Artifact. Rate-Limit → Abbruch ohne Ergebnis (Exit 3).
# Nur Hand-Start, kein Zeitplan. Ab 05.12.2026 (ET) no-op.
# Rückweg: Cleanup-PR löscht diese Datei + scripts/probe_bjdx_actions.py +
# scripts/probe_epr_measure.py + scripts/mock_test_probe_epr_bjdx.py.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-epr-bjdx
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main (nur lesen)
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: BJDX-Aktionsbeleg (Rate-Limit → Abbruch ohne Ergebnis)
        run: python scripts/probe_bjdx_actions.py --out "$RUNNER_TEMP/probe_epr_bjdx/bjdx_actions.json"

      - name: Messlauf entry_past_return_5d (Rate-Limit → Abbruch ohne Ergebnis)
        run: python scripts/probe_epr_measure.py --out "$RUNNER_TEMP/probe_epr_bjdx/epr_measure.json"

      - name: Artifact hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-epr-bjdx-${{ github.run_id }}
          path: ${{ runner.temp }}/probe_epr_bjdx/
          if-no-files-found: warn
          retention-days: 30
