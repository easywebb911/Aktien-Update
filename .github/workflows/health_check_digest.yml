name: Health-Check Daily Digest

# Phase 3 — täglicher Aggregations-Push laut Spec
# docs/health_check_spec.md "Daily-Digest-Format".
#
# Cron-Offset (Stand 16.05.2026 nach erneuter Diagnose):
# - Spec-Wortlaut war ``0 8 * * *``.
# - Iteration 1 ``13 8 * * *`` wurde am 15.05. gedropt (State-Commit
#   erst um 10:37 UTC statt 08:13 → Drift > 2 h).
# - Iteration 2 ``21 8 * * *`` ebenfalls gedropt am 16.05. (08:21 Slot
#   nicht gefeuert; die 15.05.-Korrektur war nicht weit genug vom
#   Stunden-Peak entfernt).
# - Iteration 3 ``47 8 * * *`` — deutlich näher zur Stunden-Mitte,
#   analog ki_agent ``17 * * * *``-Erfolgs-Pattern (Coverage > 95 %).

# Seit 17.11.2026 (Easy-Entscheid): Hauptauslöser ist der Anstoß am Ende des
# Postclose-Daily-Runs (auch bei dessen Fehlschlag, if: always()). Der
# Zeitplan 08:47 UTC bleibt als Rückfall (Wochenende, ausgefallener Postclose,
# fehlender Anstoß); die Tages-Sperre last_digest_sent verhindert Doppelversand
# (Digest-Tag beginnt um 21:00 UTC, scripts/health_check_digest.digest_day).
on:
  schedule:
    - cron: '47 8 * * *'
  workflow_dispatch:   # Manueller Trigger jederzeit (Mehrfach-Trigger-
                       # Schutz im Skript via last_digest_sent-Datum).
    inputs:
      upstream_status:
        # Anstoß am Ende des Postclose-Daily-Runs (17.11.2026): dessen
        # job.status (success/failure/cancelled). Leer bei Zeitplan/Hand-Start.
        description: 'nur für den Anstoß aus dem Daily-Run (job.status des Postclose)'
        type: string
        required: false
        default: ''
      upstream_run:
        description: 'nur für den Anstoß aus dem Daily-Run (Run-Nummer des Postclose)'
        type: string
        required: false
        default: ''
      paper_c:
        # Paper-C-Freeze (SESSION_HANDOVER.md, eingefroren 07.11.2026):
        # EINMALIGER Auswertungslauf. Das Skript bricht selbst ab, wenn
        # schon eine paper_c-Zeile in eval_results.jsonl steht, der
        # Freeze-Block abweicht oder nicht von main gestartet wurde.
        description: 'Paper C einmalig auswerten (nur einmal setzen)'
        type: boolean
        default: false
      hypothesen_nov26_s1:
        # Hypothesen-Runde November 2026 (SESSION_HANDOVER.md, eingefroren
        # 12.11.2026, PR #684): EINMALIGER Stufe-1-Lauf. Das Skript bricht
        # selbst ab bei vorhandener hyp_nov26_s1-Zeile, abweichendem
        # Freeze-Block (MD5), Zählung ≠ Block E oder Start nicht von main.
        description: 'Hypothesen-Runde Nov 2026, Stufe 1 einmalig auswerten (nur einmal setzen)'
        type: boolean
        default: false

permissions:
  contents: write   # Für Commit von health_check_digest_state.json

# Anstoß (Daily-Run) und Zeitplan können zusammenfallen: nacheinander statt
# parallel — der zweite Lauf sieht dann last_digest_sent und sendet nicht.
concurrency:
  group: health-check-digest
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install runtime dependencies
        run: pip install requests

      # Ablauf seit 17.11.2026 (Befund 16.11.: 6189-Byte-Digest kam als
      # verfallener ntfy-Anhang an): (1) prepare rechnet, legt den Volltext
      # unter health_check_digests/<Datum>.txt ab und schreibt die
      # Kurzfassung in eine Outbox ($RUNNER_TEMP, nicht im Repo); (2) die
      # Ablage wird nach main gepusht; (3) send schickt die Kurzfassung
      # (<= 3500 Bytes) mit Link — nur wenn (2) nachweislich gepusht hat,
      # sonst mit Hinweis statt totem Link.
      - name: Run Health-Check Digest (prepare)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          UPSTREAM_STATUS: ${{ inputs.upstream_status }}
          UPSTREAM_RUN: ${{ inputs.upstream_run }}
        run: python scripts/health_check_digest.py --phase prepare --outbox "$RUNNER_TEMP/digest_outbox.json"

      - name: Publish full digest (health_check_digests/)
        id: publish
        continue-on-error: true
        run: |
          # Eigener Worktree: der Arbeitsbaum (State-Dateien aus prepare) wird
          # NICHT zurückgesetzt. Nur health_check_digests/ wird committet.
          OUTBOX="$RUNNER_TEMP/digest_outbox.json"
          if [ ! -f "$OUTBOX" ]; then
            echo "Keine Outbox (heute schon gesendet oder prepare gescheitert) — nichts abzulegen."
            exit 0
          fi
          DDATE="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["digest_date"])' "$OUTBOX")"
          if [ ! -f "health_check_digests/${DDATE}.txt" ]; then
            echo "ERROR: Volltext health_check_digests/${DDATE}.txt fehlt — kein Link."
            exit 1
          fi
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          SRC="$(pwd)/health_check_digests"
          PUB="${RUNNER_TEMP}/digest_publish"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if ! git fetch origin main; then
              echo "fetch fehlgeschlagen (Versuch $attempt) — retry."
              sleep 2
              continue
            fi
            if [ -d "$PUB" ]; then
              git worktree remove --force "$PUB"
            fi
            git worktree add --detach "$PUB" origin/main
            mkdir -p "$PUB/health_check_digests"
            cp "$SRC/${DDATE}.txt" "$PUB/health_check_digests/"
            # published nur bei: Datei schon identisch auf main ODER
            # commit UND push erfolgreich (keine &&-Kette mit verschlucktem
            # Fehler: jeder Teilbefehl muss gelingen).
            if ( cd "$PUB" && git add health_check_digests && \
                 { git diff --staged --quiet || \
                   { git commit -m "Health-Check-Digest Volltext $(date -u '+%Y-%m-%d')" && \
                     git push origin HEAD:main; }; } ); then
              pushed=1
              break
            fi
            echo "push rejected (Versuch $attempt) — neu fetchen und retry."
            sleep 2
          done
          if [ "$pushed" -eq 1 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Digest-Datei nicht gepusht — Push enthält Hinweis statt Link."
            exit 1
          fi

      - name: Send digest push (short)
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/health_check_digest.py --phase send --outbox "$RUNNER_TEMP/digest_outbox.json" --published "${{ steps.publish.outputs.published }}"

      - name: Paper C — einmalige Freeze-Auswertung (nur bei Input paper_c)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.paper_c }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/paper_c_eval.py --run

      - name: Hypothesen-Runde Nov 2026 — einmalige Stufe-1-Auswertung (nur bei Input hypothesen_nov26_s1)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.hypothesen_nov26_s1 }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/hypothesen_nov26_eval.py --run --stage 1

      - name: Commit digest state
        if: always()   # state immer persistieren, auch wenn Skript exit 1
                       # bei ntfy-Send-Fail (16.05.2026 — Fail-Visibility-Fix).
                       # Sonst würde Mehrfach-Trigger-Schutz nicht greifen.
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Robustes Persistieren des digest-state-Markers gegen parallele
          # Pushes. main ist sehr aktiv (ki_agent stuendlich `17 * * * *`,
          # Daily-Run mehrmals taeglich). Die alte Rebase-mit-Konflikt-
          # Aufloesung scheiterte reproduzierbar: entweder push-Reject
          # (non-fast-forward, kein Retry) oder --ours verwarf unter Rebase
          # die frische Schreibung. Folge: last_digest_sent kam nie nach
          # main, S8 zaehlte hoch (Fehlalarm trotz gruenem ntfy-Push).
          #
          # Neues Muster: die vom Skript geschriebene digest-state-Version
          # sichern, dann in einer Retry-Schleife auf den jeweils NEUESTEN
          # origin/main-Stand aufsetzen (reset --hard) + die frische Version
          # wieder einspielen + commit + push. Bei push-Reject neu fetchen
          # und erneut versuchen. health_check_digest_state.json UND
          # eval_results.jsonl (Erratum 22.10.2026, Freeze-Auswertungs-
          # Autorun — scripts/freeze_eval.py) werden von diesem Workflow
          # geschrieben — keine anderen Files im Spiel, daher ist
          # reset --hard hier verlustfrei (frische Versionen in
          # $RUNNER_TEMP). eval_results.jsonl existiert an den meisten
          # Tagen NICHT (nur bei EVAL_AUTORUN_ENABLED UND Auslöser erreicht)
          # — defensiv nur sichern/wiedereinspielen wenn vorhanden (Lehre
          # #501: ein neu persistiertes File OHNE git-add-Eintrag geht beim
          # nächsten Checkout verloren).
          FRESH="${RUNNER_TEMP:-/tmp}/digest_state_fresh.json"
          cp health_check_digest_state.json "$FRESH"
          # Volltext-Ablage (17.11.2026): falls der Publish-Schritt scheiterte,
          # hier ein zweiter Versuch (die Push-Nachricht hat dann schon den
          # Hinweis „nicht abgelegt“ — der spätere Link-Ort ist trotzdem gefüllt).
          FRESH_DG="${RUNNER_TEMP:-/tmp}/digest_archive_fresh"
          mkdir -p "$FRESH_DG"
          if [ -d health_check_digests ]; then
            cp health_check_digests/*.txt "$FRESH_DG"/
          fi
          FRESH_EVAL="${RUNNER_TEMP:-/tmp}/eval_results_fresh.jsonl"
          if [ -f eval_results.jsonl ]; then
            cp eval_results.jsonl "$FRESH_EVAL"
          fi
          # eval_results_sensitivity.jsonl (03.11.2026, §4-Sensitivität im
          # selben Lauf wie die Hauptauswertung): analog defensiv sichern —
          # ohne sie zeigte der Digest ab dem Folgetag nur die Zurückhalte-Zeile.
          FRESH_SENS="${RUNNER_TEMP:-/tmp}/eval_results_sensitivity_fresh.jsonl"
          if [ -f eval_results_sensitivity.jsonl ]; then
            cp eval_results_sensitivity.jsonl "$FRESH_SENS"
          fi
          # position_watchlist_state.json (31.10.2026, Position-ohne-
          # Watchlist-Wächter): analog eval_results.jsonl defensiv nur
          # sichern/wiedereinspielen wenn vorhanden — existiert erst nach
          # dem ersten Digest-Lauf, der eine Position ohne Watchlist-
          # Eintrag sieht ODER eine bestehende Grace-Periode weiterführt.
          FRESH_WL="${RUNNER_TEMP:-/tmp}/position_watchlist_state_fresh.json"
          if [ -f position_watchlist_state.json ]; then
            cp position_watchlist_state.json "$FRESH_WL"
          fi
          pushed=0
          for attempt in 1 2 3 4 5; do
            if ! git fetch origin main; then
              echo "fetch fehlgeschlagen (Versuch $attempt) — retry."
              sleep 2
              continue
            fi
            git reset --hard origin/main
            cp "$FRESH" health_check_digest_state.json
            git add health_check_digest_state.json
            if [ -n "$(ls "$FRESH_DG" 2>/dev/null)" ]; then
              mkdir -p health_check_digests
              cp "$FRESH_DG"/*.txt health_check_digests/
              git add health_check_digests
            fi
            if [ -f "$FRESH_EVAL" ]; then
              cp "$FRESH_EVAL" eval_results.jsonl
              git add eval_results.jsonl
            fi
            if [ -f "$FRESH_SENS" ]; then
              cp "$FRESH_SENS" eval_results_sensitivity.jsonl
              git add eval_results_sensitivity.jsonl
            fi
            if [ -f "$FRESH_WL" ]; then
              cp "$FRESH_WL" position_watchlist_state.json
              git add position_watchlist_state.json
            fi
            if git diff --staged --quiet; then
              echo "Keine state-Aenderung gegenueber origin/main — kein Commit noetig."
              pushed=1
              break
            fi
            git commit -m "Health-Check-Digest state $(date -u '+%Y-%m-%d')"
            if git push origin main; then
              echo "digest-state gepusht (Versuch $attempt)."
              pushed=1
              break
            fi
            echo "push rejected (Versuch $attempt) — neu fetchen und retry."
            sleep 2
          done
          if [ "$pushed" -ne 1 ]; then
            echo "ERROR: digest-state konnte nach 5 Versuchen nicht gepusht werden."
            exit 1
          fi
          # Diagnose: welcher Marker tatsaechlich nach main ging.
          echo "Push-Check — last_digest_sent in main:"
          grep last_digest_sent health_check_digest_state.json || true

      - name: Fail run if full digest was not published
        # Publish hat continue-on-error (der Push geht trotzdem raus, mit
        # Hinweis statt Link) — der Lauf soll dann aber rot sein, damit der
        # Ablage-Fehler auffällt (GitHub-Mail an Easy).
        if: ${{ always() && steps.publish.outcome == 'failure' }}
        run: |
          echo "Volltext-Ablage fehlgeschlagen — siehe Schritt 'Publish full digest'."
          exit 1
