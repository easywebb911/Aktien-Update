name: SUW Auswertung (Leerverkäufer unter Wasser)

# Regel SUW (open_item regel-suw-shorts-unter-wasser, festgeschrieben
# 15.11.2026, Commit 8cd6d065), umgesetzt in scripts/suw_eval.py.
#
# Betriebsarten (Eingabe beim Hand-Start):
#   nachrechnen  nur Einstiege ≤ 23.10.2026 (offenes Fenster) — unabhängige
#                Nachrechnung der im Chat gerechneten Werte, Abgleich gegen die
#                im Skript festgeschriebene Toleranz.
#   test         nur Einstiege ≥ 24.10.2026; vor dem Auslöser (60 Einstiegstage
#                mit endgültigem Schluss Tag 10) NUR Zählerstand — keine Kurse,
#                keine FINRA-Dateien, keine Rendite.
#
# Nur Hand-Start, kein Zeitplan. Liest Repo-Dateien, holt FINRA-CNMS-Dateien
# (cdn.finra.org) und Yahoo-Tageskurse (yfinance, auto_adjust=False) mit
# Pausen. Ergebnis als Artifact + Log-Tabelle. Einziger Schreibweg ins Repo
# (seit Teil B, Freeze-Block „VORABREGISTRIERUNG — SUW“): in Betriebsart test
# NACH dem Auslöser hängt das Skript je Test eine Zeile an eval_results.jsonl;
# der Commit-Schritt unten pusht NUR diese Datei (append-only geprüft).
# Vor dem Auslöser und in nachrechnen wird nichts geschrieben. Keine Secrets.

on:
  workflow_dispatch:
    inputs:
      betriebsart:
        description: 'nachrechnen (≤ 23.10.2026) oder test (≥ 24.10.2026, nur nach Auslöser)'
        required: true
        type: choice
        options:
          - nachrechnen
          - test

permissions:
  contents: write   # NUR für eval_results.jsonl (Betriebsart test, nach Auslöser)

concurrency:
  group: suw-eval
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  suw-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: SUW auswerten
        env:
          BETRIEBSART: ${{ inputs.betriebsart }}
        run: python scripts/suw_eval.py --mode "$BETRIEBSART" --out "${RUNNER_TEMP}/suw_eval_result.json"

      - name: Ergebnis als Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suw-eval-${{ inputs.betriebsart }}-${{ github.run_id }}
          path: ${{ runner.temp }}/suw_eval_result.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit eval_results (nur test, nur nach Auswertung)
        if: ${{ inputs.betriebsart == 'test' }}
        run: |
          if git diff --quiet -- eval_results.jsonl; then
            echo "eval_results.jsonl unverändert — nichts zu committen."
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          FRESH="${RUNNER_TEMP}/eval_results_fresh.jsonl"
          cp eval_results.jsonl "$FRESH"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if ! git fetch origin main; then
              echo "fetch fehlgeschlagen (Versuch $attempt) — retry."
              sleep 2
              continue
            fi
            git reset --hard origin/main
            ORIG_SIZE=$(stat -c %s eval_results.jsonl)
            if ! cmp -s -n "$ORIG_SIZE" eval_results.jsonl "$FRESH"; then
              echo "ERROR: eval_results.jsonl auf origin ist kein Präfix der neuen Datei — kein Push."
              exit 1
            fi
            cp "$FRESH" eval_results.jsonl
            git add eval_results.jsonl
            git commit -m "SUW-Freeze-Auswertung: eval_results $(date -u '+%Y-%m-%d')"
            if git push origin main; then
              echo "eval_results gepusht (Versuch $attempt)."
              pushed=1
              break
            fi
            echo "push rejected (Versuch $attempt) — retry."
            sleep 2
          done
          if [ "$pushed" -ne 1 ]; then
            echo "ERROR: eval_results konnte nicht gepusht werden — Artifact enthält die Zeilen."
            exit 1
          fi
