name: Optionen Handelszeit

# Options-Sammlung in der US-Handelszeit (Easy-Entscheid 16.11.2026, open_item
# erkundungsfeld-plan Teil B). REINE SAMMLUNG — keine Auswertung, keine Rendite,
# keine Anzeige. Script: options_intraday.py. Schreibt AUSSCHLIESSLICH
# options_chain_intraday.jsonl (nur angehängt) und options_intraday_state.json.
# Die Nachtsammlung options_chain_raw.jsonl (Daily-Run) bleibt unverändert.
#
# Auslöser (Easy-Entscheid 23.11.2026): NICHT mehr per Zeitplan. Die drei
# früheren Slots (15:07/16:37/18:07 UTC) starteten bei GitHub erst 22:13–00:57
# UTC und lagen nie im Fenster (Wächter 23.11.). Stattdessen startet dieser
# Workflow nach JEDEM Ende (Erfolg oder Fehlschlag) des Tageslaufs „Daily
# Squeeze Report“ und des „KI-Agent Squeeze Monitor“ auf main (workflow_run).
# Beleg 09.–23.11.2026: Tageslauf allein endete an 8 von 11 Handelstagen im
# Fenster, mit KI-Lauf an 11 von 11. Die beiden auslösenden Workflows bleiben
# unverändert und warten nie auf diesen (getrennter Workflow, eigene
# concurrency). Das Skript entscheidet selbst: nur an US-Handelstagen
# (config.US_MARKET_HOLIDAYS), nur im Fenster 10:00–15:30 ET (an verkürzten
# Tagen aus config.US_EARLY_CLOSE_DAYS bis Schluss − 30 min) und höchstens
# EINE Messung je Handelstag (already_done) — alle übrigen Auslöser enden
# nach wenigen Sekunden ohne Abruf.
#
# Rückweg: den PR revertieren (Zeitplan-Slots kehren zurück); die gesammelten
# Dateien dürfen liegen bleiben (kein Konsument außer dem Digest).

on:
  workflow_run:
    workflows: ["Daily Squeeze Report", "KI-Agent Squeeze Monitor"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # NUR für options_chain_intraday.jsonl + options_intraday_state.json

concurrency:
  group: options-intraday
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  options-intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Optionen sammeln
        env:
          AUSLOESER_EVENT: ${{ github.event_name }}
          AUSLOESER_WORKFLOW: ${{ github.event.workflow_run.name }}
          AUSLOESER_FAZIT: ${{ github.event.workflow_run.conclusion }}
          AUSLOESER_EVENT_VORLAUF: ${{ github.event.workflow_run.event }}
        run: |
          # Beleg im Log: wer hat diesen Lauf ausgelöst (nur Namen, keine Daten).
          echo "Auslöser: ${AUSLOESER_EVENT} ${AUSLOESER_WORKFLOW} (${AUSLOESER_EVENT_VORLAUF}, ${AUSLOESER_FAZIT})"
          python options_intraday.py

      - name: Commit options_chain_intraday + state
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Muster wie outcome_path.yml: frische Versionen sichern, auf den
          # NEUESTEN origin/main-Stand aufsetzen und NUR die zwei eigenen Dateien
          # wieder einspielen (dieser Workflow schreibt keine anderen Dateien).
          FRESH_DATA="${RUNNER_TEMP:-/tmp}/options_intraday_fresh.jsonl"
          FRESH_STATE="${RUNNER_TEMP:-/tmp}/options_intraday_state_fresh.json"
          if [ -z "$(git status --porcelain -- options_intraday_state.json options_chain_intraday.jsonl)" ]; then
            echo "Nichts gesammelt (übersprungen) — nichts zu committen."
            exit 0
          fi
          cp options_intraday_state.json "$FRESH_STATE"
          if [ -f options_chain_intraday.jsonl ]; then cp options_chain_intraday.jsonl "$FRESH_DATA"; fi
          pushed=0
          for attempt in 1 2 3 4 5; do
            if ! git fetch origin main; then
              echo "fetch fehlgeschlagen (Versuch $attempt) — retry."
              sleep 2
              continue
            fi
            git reset --hard origin/main
            # Append-only-Härtung: origin-Stand muss byte-genau Anfang der
            # frischen Datei sein, sonst Abbruch (keine Zeile überschreiben).
            if [ -f options_chain_intraday.jsonl ] && [ -f "$FRESH_DATA" ]; then
              ORIG_SIZE=$(stat -c %s options_chain_intraday.jsonl)
              if ! cmp -s -n "$ORIG_SIZE" options_chain_intraday.jsonl "$FRESH_DATA"; then
                echo "ERROR: options_chain_intraday.jsonl auf origin ist kein Präfix der neuen Datei — kein Push."
                exit 1
              fi
            fi
            cp "$FRESH_STATE" options_intraday_state.json
            if [ -f "$FRESH_DATA" ]; then cp "$FRESH_DATA" options_chain_intraday.jsonl; fi
            git add options_intraday_state.json
            if [ -f options_chain_intraday.jsonl ]; then git add options_chain_intraday.jsonl; fi
            if git diff --staged --quiet; then
              echo "Keine Aenderung gegenueber origin/main."
              pushed=1
              break
            fi
            git commit -m "Optionen Handelszeit $(date -u '+%Y-%m-%d %H:%M') UTC"
            if git push origin main; then
              echo "options_intraday gepusht (Versuch $attempt)."
              pushed=1
              break
            fi
            echo "push rejected (Versuch $attempt) — neu fetchen und retry."
            sleep 2
          done
          if [ "$pushed" -ne 1 ]; then
            echo "ERROR: options_intraday konnte nach 5 Versuchen nicht gepusht werden."
            exit 1
          fi
