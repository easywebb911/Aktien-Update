name: Renditen-Korrektur (einmalig)

# EINMALIGE Bestandskorrektur der Backtest-Renditen aus finalen Schlusskursen
# (Schritt 2/3, Easy-Entscheid 03.11.2026; Mechanik-Fix #647). Skript:
# scripts/fix_returns_final_close_oneoff.py.
#
# BLINDUNG: das Log enthält nur Zählungen und Abweichungs-Beträge |alt − neu|,
# keine Renditewerte. Das Archiv (alte Werte) wird nur geschrieben, nie geloggt.
#
# dry_run (Default): nur Leserecht, schreibt nichts.
# apply: schreibt backtest_history.json + matured_backtest_export.jsonl +
#        return_corrections_archive_2026-11.jsonl in EINEM Commit auf main.
#        Bricht ohne Schreiben ab, wenn ein Daily-Run oder KI-Agent-Lauf aktiv
#        ist oder sich die Dateien auf main seit dem Lesen geändert haben.
# Rückweg: Skript-Modus restore (siehe PR) + Revert. Nach Apply und Prüfung
# wird dieser Workflow samt Skript wieder gelöscht (Rückweg-PR).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run = nur rechnen und berichten · apply = schreiben"
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - apply
      target:
        description: "returns = Renditen (#648) · maxgain_shadow = max_gain/max_drawdown + Exit-Shadow-Forwards"
        required: true
        default: returns
        type: choice
        options:
          - returns
          - maxgain_shadow
      skip_tickers:
        description: "nur nach Easy-Entscheid: Ticker überspringen (Komma-Liste, Felder bleiben unverändert) — Default leer"
        required: false
        default: ""
        type: string
      max_null:
        description: "nur apply: Zahl „Auf null gesetzt gesamt“ aus dem dry_run (Obergrenze)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: fix-returns-oneoff
  cancel-in-progress: false

jobs:
  dry_run:
    if: ${{ inputs.mode == 'dry_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Dry-Run (nur Zahlen, schreibt nichts)
        env:
          TARGET: ${{ inputs.target }}
          SKIP: ${{ inputs.skip_tickers }}
        run: python scripts/fix_returns_final_close_oneoff.py --mode dry_run --target "$TARGET" --skip-tickers "$SKIP"
      - name: Beleg — keine Datei geändert
        run: git diff --exit-code

  apply:
    if: ${{ inputs.mode == 'apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Kein Daily-Run / KI-Agent aktiv?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in daily-squeeze-report.yml ki_agent.yml; do
            for st in in_progress queued waiting pending requested; do
              n=$(gh run list --workflow "$wf" --status "$st" --json databaseId --jq 'length')
              if [ "$n" != "0" ]; then
                echo "ABBRUCH: $wf hat $n Lauf/Läufe im Status $st — nichts geschrieben. Später erneut starten."
                exit 1
              fi
            done
          done

      - name: Gelesenen Stand merken
        id: read
        run: |
          echo "bt=$(git rev-parse HEAD:backtest_history.json)" >> "$GITHUB_OUTPUT"
          echo "ex=$(git rev-parse HEAD:matured_backtest_export.jsonl)" >> "$GITHUB_OUTPUT"
          echo "sh=$(git rev-parse HEAD:exit_shadow_log.jsonl)" >> "$GITHUB_OUTPUT"

      - name: Korrektur rechnen und schreiben (lokal)
        env:
          MAX_NULL: ${{ inputs.max_null }}
          TARGET: ${{ inputs.target }}
          SKIP: ${{ inputs.skip_tickers }}
        run: |
          case "$MAX_NULL" in
            ''|*[!0-9]*) echo "ABBRUCH: max_null fehlt oder ist keine Zahl — erst dry_run lesen. Nichts geschrieben."; exit 1 ;;
          esac
          python scripts/fix_returns_final_close_oneoff.py --mode apply --max-null "$MAX_NULL" --target "$TARGET" --skip-tickers "$SKIP"

      - name: Prüfen, Commit, Push (bricht bei Änderung auf main ab)
        env:
          READ_BT: ${{ steps.read.outputs.bt }}
          READ_EX: ${{ steps.read.outputs.ex }}
          READ_SH: ${{ steps.read.outputs.sh }}
          TARGET: ${{ inputs.target }}
        run: |
          if git diff --quiet -- backtest_history.json matured_backtest_export.jsonl exit_shadow_log.jsonl; then
            echo "Keine Änderung — nichts zu committen."
            exit 0
          fi
          git fetch origin main
          now_bt=$(git rev-parse origin/main:backtest_history.json)
          now_ex=$(git rev-parse origin/main:matured_backtest_export.jsonl)
          now_sh=$(git rev-parse origin/main:exit_shadow_log.jsonl)
          if [ "$now_bt" != "$READ_BT" ] || [ "$now_ex" != "$READ_EX" ] || [ "$now_sh" != "$READ_SH" ]; then
            echo "ABBRUCH: Dateien auf main seit dem Lesen geändert — nichts gepusht. Später erneut starten."
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest_history.json matured_backtest_export.jsonl exit_shadow_log.jsonl
          for f in return_corrections_archive_2026-11.jsonl maxgain_shadow_corrections_archive_2026-11.jsonl; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if [ "$TARGET" = "maxgain_shadow" ]; then
            git commit -m "fix(data): max_gain/max_drawdown + Exit-Shadow-Forwards aus finalen Kursen (#652)"
          else
            git commit -m "fix(data): Renditen-Bestandskorrektur aus finalen Schlusskursen (#648, §4-Protokolleintrag 03.11.2026)"
          fi
          git rebase origin/main
          git push origin HEAD:main
